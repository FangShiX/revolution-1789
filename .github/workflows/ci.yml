name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run release:check
      - name: Install CJK fonts for actual Chinese rendering
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Browser release checks
        run: |
          npm run preview -- --port 5173 > /tmp/revolution-preview.log 2>&1 &
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:5173
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: test-results/
